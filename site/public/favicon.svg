<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The matrix in miniature: a grid that is nearly all green, and still fails. -->
  <rect width="32" height="32" rx="6" fill="#0C0F14"/>
  <g fill="#2F8F5B" fill-opacity=".65">
    <rect x="5"  y="5"  width="6" height="6" rx="1.4"/>
    <rect x="13" y="5"  width="6" height="6" rx="1.4"/>
    <rect x="21" y="5"  width="6" height="6" rx="1.4"/>
    <rect x="5"  y="13" width="6" height="6" rx="1.4"/>
    <rect x="21" y="13" width="6" height="6" rx="1.4"/>
    <rect x="5"  y="21" width="6" height="6" rx="1.4"/>
    <rect x="13" y="21" width="6" height="6" rx="1.4"/>
  </g>
  <rect x="13" y="13" width="6" height="6" rx="1.4" fill="#CE3A57"/>
  <rect x="21" y="21" width="6" height="6" rx="1.4" fill="#CE3A57"/>
</svg>
