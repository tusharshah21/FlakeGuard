# FlakeGuard configuration. All thresholds are enforced in Python, never by the model.

[target]
repo = "dask/distributed"
scratch_repo = "tusharshah21/FlakeGuard"   # the ONLY repo FlakeGuard writes to; never the analysis target
scratch_branch = "scratch"                  # the ONLY base branch PRs may target; never main. Asserted in code.
workflow = "tests.yaml"
source = "junit_artifacts"                          # Source A, pooled across matrix cells; see probe-results/
exclude_cell_prefixes = ["ubuntu-latest-mindeps-"]  # distinct dependency env; never pooled with the rest
same_commit_event = "schedule"                      # cron re-runs of identical code on main
same_commit_branch = "main"

# How a GitHub job name maps onto its matrix cell, which is also the name of the JUnit artifact that job uploads.
# This is the one thing every repository does differently, so it lives here rather than in code.
#   - the named group `cell` is required; its words are joined with cell_join
#   - any further named groups are suffixes, and their internal spaces are dropped
#   - cell_filter keeps only cells containing that substring; "" keeps everything
#   - a pattern that matches no job aborts the ingest with an error rather than silently storing nothing
#
# dask/distributed: "ubuntu-latest py312 test-ci not ci1"  ->  "ubuntu-latest-py312-test-ci-notci1"
# Single quotes: TOML literal strings, so regex backslashes need no escaping.
cell_pattern = '^(?P<cell>\S+ \S+ \S+)(?: (?P<partition>.+))?$'
cell_join = "-"
cell_filter = "-test-"
#
# Other shapes, for reference. A typical GitHub matrix job, "test (ubuntu-latest, 3.12)":
#   cell_pattern = '^test \((?P<cell>[^)]+)\)$'
#   cell_filter  = ""
# A job named after its platform, "pytest-ubuntu-py311":
#   cell_pattern = '^(?P<cell>pytest-.+)$'
#   cell_filter  = ""

[ingest]
days = 95                        # backfill window; artifacts only survive ~90 of them
cache_dir = ".cache/artifacts"   # raw zips + API listings; parsing never re-downloads
db_path = "flakeguard.db"

[stats]
z = 1.96                        # 95% Wilson interval
min_onset_effect = 0.2          # rise in failure rate between consecutive commits that counts as an onset
platform_min_fails = 3          # below this, dispersion is uninformative
platform_top_cell_share = 0.75  # >= this share of failures in one cell -> concentrated
platform_top_os_share = 0.8     # >= this share of failures on one OS -> concentrated
chronic_min_commits = 3         # spread recoveries across this many commits -> chronic

[classify]
# Shared by baseline.py and the classifier prompt. Applied to the most recent commit with any failure.
regression_ci_low = 0.5   # Wilson lower bound at/above this -> regression
flaky_ci_high = 0.1       # Wilson upper bound at/below this -> flaky

[triage]
window_runs = 50
min_runs = 15                   # fewer runs in the window than this -> review, never act
action_threshold = 0.75         # classifier confidence below this -> review, never act
unquarantine_after_passes = 20  # a quarantined test with this many consecutive clean runs since quarantine is un-quarantined
dry_run = true                  # SAFE DEFAULT. Writing to a repository is opt-in: set false deliberately, or pass
                                # --dry-run to force dry regardless of this value. Startup prints the effective mode.
recent_failure_days = 7         # the scheduled sweep triages tests that failed within this many days
max_actions_per_sweep = 3       # new issues + quarantine PRs per sweep; the rest are deferred to the next sweep
max_explain_model_calls = 10    # ceiling on model turns in one `explain`, so an exploratory loop cannot run away
max_model_calls_per_sweep = 30  # hard ceiling on classify+correlate+draft calls; aborts the sweep, red and loud.
                                # ~2 calls per acted-on test and the artifact cap (3) now gates inference, so a
                                # full pass costs ~6-8; 30 is headroom for retries, not a working limit.

[overrides]
ignore_tests = []               # test ids FlakeGuard must never act on; the label flakeguard-override does the same per artifact

[bedrock]
model_id = "us.anthropic.claude-sonnet-4-5-20250929-v1:0"  # Sonnet 4.6 pending the Anthropic use-case form on this account
region = "us-east-1"
